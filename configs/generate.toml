# Configuration for generating synthetic trajectories

# Base output directory for generated trajectories
base_dir = "./generated_paths/test_flight"

# Number of samples to generate
# Will be split evenly between red and blue objects
samples = 10

# Recording frequency in Hz
# Can be an integer or a range like "1-10" 
record_hz = 3

# Task type
task_tag = "whale"

# Parallel processing settings
n_jobs = 16

# Tags of objects to generate trajectories for
object_tags = ["R", "B"]
